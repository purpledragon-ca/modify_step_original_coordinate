<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEP File Repair</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed #2d3148;
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .dropzone:hover, .dropzone.drag-over {
      border-color: #6366f1;
      background: #1e2035;
    }
    .dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .dropzone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .dropzone-label { font-size: 0.9rem; color: #94a3b8; }
    .dropzone-label span { color: #818cf8; text-decoration: underline; }
    .filename {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: #6366f1;
      word-break: break-all;
    }

    /* Options */
    .options {
      margin: 1.25rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      cursor: pointer;
    }
    .option input[type="checkbox"] { margin-top: 2px; accent-color: #6366f1; flex-shrink: 0; }
    .option-text { font-size: 0.85rem; }
    .option-text strong { display: block; color: #e2e8f0; }
    .option-text span { color: #64748b; font-size: 0.78rem; }

    /* Button */
    button#repairBtn {
      width: 100%;
      padding: 0.7rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button#repairBtn:hover:not(:disabled) { background: #4f52d6; }
    button#repairBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Result */
    #result {
      margin-top: 1.25rem;
      border-radius: 7px;
      padding: 0.9rem 1rem;
      font-size: 0.84rem;
      display: none;
    }
    #result.success { background: #0d2d1e; border: 1px solid #166534; color: #4ade80; }
    #result.error   { background: #2d0d0d; border: 1px solid #991b1b; color: #f87171; }

    #result .summary { margin-bottom: 0.6rem; font-weight: 500; }
    #result .stats { color: #86efac; font-size: 0.79rem; margin-bottom: 0.8rem; }
    #result.error .stats { display: none; }

    #result a {
      display: inline-block;
      padding: 0.45rem 1rem;
      background: #166534;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    #result a:hover { background: #15803d; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <h1>STEP File Repair</h1>
  <p class="subtitle">Fixes Shapr3D export defects before Isaac Sim / Shapr3D re-import</p>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".step,.stp">
    <div class="dropzone-icon">📂</div>
    <div class="dropzone-label">Drop a <strong>.step</strong> file here or <span>browse</span></div>
    <div class="filename" id="filename"></div>
  </div>

  <div class="options">
    <label class="option">
      <input type="checkbox" id="fixSyntax" checked>
      <div class="option-text">
        <strong>Fix REAL literal syntax</strong>
        <span>Converts bare integers in DIRECTION vectors (e.g. <code>-0</code>, <code>1</code>) to valid STEP REAL notation (<code>0.</code>, <code>1.</code>). Removes "Incorrect Syntax" parser errors.</span>
      </div>
    </label>
    <label class="option">
      <input type="checkbox" id="fixZ" checked>
      <div class="option-text">
        <strong>Flip Z-axis to Z-up</strong>
        <span>Shapr3D sets the global product frame to Z-down (0,0,-1). This flips all assembly-level placement frames to Z-up so components load correctly in Isaac Sim and other Z-up tools.</span>
      </div>
    </label>
  </div>

  <button id="repairBtn" disabled>Repair &amp; Download</button>

  <div id="result">
    <div class="summary" id="resultSummary"></div>
    <div class="stats" id="resultStats"></div>
    <a id="downloadLink" href="#" download>Download repaired file</a>
  </div>
</div>

<script>
  const dropzone   = document.getElementById('dropzone');
  const fileInput  = document.getElementById('fileInput');
  const filename   = document.getElementById('filename');
  const repairBtn  = document.getElementById('repairBtn');
  const result     = document.getElementById('result');
  const summary    = document.getElementById('resultSummary');
  const stats      = document.getElementById('resultStats');
  const dlLink     = document.getElementById('downloadLink');
  const fixSyntax  = document.getElementById('fixSyntax');
  const fixZ       = document.getElementById('fixZ');

  let selectedFile = null;
  let blobUrl      = null;

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) selectFile(fileInput.files[0]);
  });

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
  });

  function selectFile(f) {
    selectedFile = f;
    filename.textContent = f.name;
    repairBtn.disabled = false;
    result.style.display = 'none';
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  }

  repairBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    repairBtn.disabled = true;
    repairBtn.innerHTML = '<span class="spinner"></span>Repairing…';
    result.style.display = 'none';
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }

    const form = new FormData();
    form.append('file', selectedFile);
    form.append('fix_syntax', fixSyntax.checked ? 'true' : 'false');
    form.append('fix_z',      fixZ.checked      ? 'true' : 'false');

    try {
      const res = await fetch('/repair', { method: 'POST', body: form });

      if (!res.ok) {
        const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        showError(data.error || `Server error ${res.status}`);
        return;
      }

      const blob   = await res.blob();
      blobUrl      = URL.createObjectURL(blob);
      const outName = res.headers.get('Content-Disposition')
                        ?.match(/filename="([^"]+)"/)?.[1]
                        ?? selectedFile.name.replace(/\.step$/i, '_repaired.step');

      const syntaxFixed  = res.headers.get('X-Syntax-Lines-Fixed')  ?? '0';
      const zFlipped     = res.headers.get('X-Z-Directions-Flipped') ?? '0';
      const repairSummary = res.headers.get('X-Repair-Summary') ?? '';

      dlLink.href     = blobUrl;
      dlLink.download = outName;

      result.className = 'success';
      summary.textContent = repairSummary || 'Repair complete';
      stats.textContent =
        `Syntax lines fixed: ${syntaxFixed}  ·  Z-directions flipped: ${zFlipped}`;
      result.style.display = 'block';

    } catch (err) {
      showError(String(err));
    } finally {
      repairBtn.disabled = false;
      repairBtn.textContent = 'Repair & Download';
    }
  });

  function showError(msg) {
    result.className = 'error';
    summary.textContent = msg;
    result.style.display = 'block';
  }
</script>
</body>
</html>
